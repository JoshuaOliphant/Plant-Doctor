[project]
name = "backend"
version = "0.1.0"
description = "PlantDoc - AI plant diagnosis backend"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "fastapi>=0.124.0",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
    "pydantic-evals>=1.27.0",
    "dspy>=3.0.4",
]

[project.scripts]
plantdoc-eval = "evals.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]
