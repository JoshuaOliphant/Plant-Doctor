[project]
name = "backend"
version = "0.1.0"
description = "PlantDoc - AI plant diagnosis backend"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "fastapi>=0.125.0",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "uvicorn>=0.38.0",
    "pydantic-evals>=1.107.6,<2",
    "dspy[litellm]>=3.5.0",
    "pydantic-ai>=1.107.6,<2",
    "pydantic-ai-slim[google,openai]>=1.107.6,<2",
]

[project.scripts]
plantdoc-eval = "evals.cli:main"

[tool.uv]
package = true
# Security floors for transitive dependencies (issue #1). Raise these rather
# than pinning; mcp and pydantic-ai stay on their current major versions.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "authlib>=1.9.1",
    "certifi>=2026.1.1",
    "cryptography>=50.0.0",
    "dnspython>=2.9.2",
    "fastmcp>=3.2.0",
    "filelock>=4.2.1",
    "idna>=3.15",
    "jaraco-context>=6.1.0",
    "json-repair>=0.60.1",
    "litellm>=1.96.2",
    "mako>=1.3.12",
    "mcp>=1.30.0,<2",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.2",
    "orjson>=3.11.6",
    "pillow>=13.0.0",
    "protobuf>=6.33.5",
    "pyasn1>=0.6.5",
    "pygments>=2.20.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]
